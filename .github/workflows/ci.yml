name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: mypy mcp_server demo tests

  unit-tests:
    name: unit tests (no Docker required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # The real proof: builds the target stack for real, triggers the same
  # incident twice against two fresh copies of it, and asserts the
  # access-control model actually holds -- readonly gets refused and
  # escalates, operator fixes it and the worker genuinely recovers. See
  # demo/run_incident_demo.py's docstring for why its exit code doubles
  # as that assertion.
  integration:
    name: incident demo (role=${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [readonly, operator]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Start target stack
        run: docker compose -f target-stack/docker-compose.yml up -d --build --wait

      - name: Run incident demo (role=${{ matrix.role }})
        run: python -m demo.run_incident_demo --role ${{ matrix.role }}

      - name: Show audit log
        if: always()
        run: cat "var/audit-${{ matrix.role }}.log" 2>/dev/null || echo "(no audit log written)"

      - name: Show container status (debugging aid on failure)
        if: failure()
        run: docker compose -f target-stack/docker-compose.yml ps

      - name: Tear down target stack
        if: always()
        run: docker compose -f target-stack/docker-compose.yml down -v
