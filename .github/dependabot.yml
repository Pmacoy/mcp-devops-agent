version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/target-stack/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/target-stack/worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
